<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heisenberg | Yönetim Paneli</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8">

    <!-- Admin Giriş Modal -->
    <div id="admin-login-modal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-2xl z-50 flex items-center justify-center p-4">
        <div class="glass w-full max-w-sm rounded-3xl p-8 text-center border border-slate-800">
            <h3 class="text-2xl font-extrabold mb-2 text-red-500">🔒 Heisenberg Admin</h3>
            <p class="text-slate-400 text-xs mb-6">Yönetici şifrenizi girin.</p>
            <input type="password" id="admin-pass" placeholder="Şifre" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm mb-4 focus:outline-none focus:border-red-500 text-white text-center">
            <button onclick="loginAdmin()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-xl transition shadow-lg shadow-red-600/20">Giriş Yap</button>
        </div>
    </div>

    <!-- Admin İçerik -->
    <div id="admin-content" class="max-w-6xl mx-auto hidden space-y-8">
        <div class="glass rounded-3xl p-6 flex justify-between items-center border border-slate-800">
            <div>
                <h1 class="text-xl font-extrabold text-red-500">⚙️ Heisenberg Yönetim Paneli</h1>
                <p class="text-slate-400 text-xs">Video Arşivi, Ödeme Hesapları (IBAN/Kripto Yönetimi ve Silme) Merkezi.</p>
            </div>
            <button onclick="location.reload()" class="bg-slate-900 border border-slate-800 hover:border-slate-700 px-4 py-2 rounded-xl text-xs font-semibold transition">Çıkış Yap</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Video / Ürün Ekleme Paneli -->
            <div class="glass rounded-3xl p-6 md:p-8 border border-slate-800 space-y-4">
                <h3 class="text-lg font-bold text-white flex items-center gap-2">
                    <i data-lucide="plus-circle" class="w-5 h-5 text-red-500"></i> Yeni Video Arşivi Ekle
                </h3>
                <div class="space-y-3">
                    <input type="text" id="new-title" placeholder="Video Başlığı (Örn: Özel Seri Vol. 3)" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-red-500">
                    <select id="new-category" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-red-500">
                        <option value="Özel Eğlence">Özel Eğlence</option>
                        <option value="Gece Serisi">Gece Serisi</option>
                        <option value="Mega Paket">Mega Paket</option>
                        <option value="Sinema & Dizi">Sinema & Dizi</option>
                        <option value="Belgesel & Eğitim">Belgesel & Eğitim</option>
                    </select>
                    <input type="number" id="new-price" placeholder="Fiyat (₺)" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-red-500">
                    <input type="file" id="new-image" accept="image/*" class="w-full text-xs text-slate-400 file:mr-3 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-slate-800 file:text-white cursor-pointer">
                </div>
                <button onclick="addNewProduct()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-red-600/25">Arşivi Yayınla</button>
            </div>

            <!-- IBAN / Kripto Cüzdan Ekleme ve Listeleme / Silme Paneli -->
            <div class="glass rounded-3xl p-6 md:p-8 border border-slate-800 space-y-4">
                <h3 class="text-lg font-bold text-white flex items-center gap-2">
                    <i data-lucide="wallet" class="w-5 h-5 text-emerald-400"></i> Ödeme Hesapları (IBAN & Kripto)
                </h3>
                <div class="space-y-3">
                    <input type="text" id="acc-name" placeholder="Hesap Adı (Örn: 3. IBAN - Enpara veya USDT TRC20)" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-red-500">
                    <select id="acc-type" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-red-500">
                        <option value="Banka / IBAN">Banka / IBAN</option>
                        <option value="Kripto">Kripto (USDT / BTC vb.)</option>
                    </select>
                    <textarea id="acc-detail" placeholder="IBAN Numarası veya Cüzdan Adresi" rows="2" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-red-500"></textarea>
                </div>
                <button onclick="addPaymentAccount()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-emerald-600/25">Yeni Hesap Ekle</button>
                
                <!-- Eklenen Hesapları Listeleme ve Silme Alanı -->
                <div class="mt-4 pt-4 border-t border-slate-800">
                    <h4 class="text-xs font-bold text-slate-400 uppercase mb-2">Kayıtlı Ödeme Hesapları & Silme:</h4>
                    <div id="admin-accounts-list" class="space-y-2 max-h-40 overflow-y-auto"></div>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="glass rounded-3xl p-6 border border-slate-800">
                <h3 class="text-base font-bold mb-4 flex items-center gap-2 text-blue-400">
                    <i data-lucide="users" class="w-5 h-5"></i> Kayıtlı Üyeler (<span id="user-count">0</span>)
                </h3>
                <div id="users-list" class="space-y-2 max-h-80 overflow-y-auto pr-1"></div>
            </div>

            <div class="glass rounded-3xl p-6 border border-slate-800">
                <h3 class="text-base font-bold mb-4 flex items-center gap-2 text-amber-400">
                    <i data-lucide="credit-card" class="w-5 h-5"></i> Ödeme Bildirimleri & Onay
                </h3>
                <div id="orders-list" class="space-y-3 max-h-80 overflow-y-auto pr-1"></div>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        const BIN_ID = '6a73c66cf5f4af5e29f07574';
        const MASTER_KEY = '$2a$10$zh2aEsam0mcpeFIrGF40pekMKtzirnqXSEFm27I6NOa1SGFR9bkG.';

        function loginAdmin() {
            const pass = document.getElementById('admin-pass').value;
            if(pass === "1234") {
                document.getElementById('admin-login-modal').classList.add('hidden');
                document.getElementById('admin-content').classList.remove('hidden');
                loadData();
            } else {
                alert("Hatalı Şifre!");
            }
        }

        async function getDatabase() {
            try {
                let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': MASTER_KEY }
                });
                let json = await res.json();
                return json.record || { users: [], orders: [], products: [], accounts: [] };
            } catch(e) {
                return { users: [], orders: [], products: [], accounts: [] };
            }
        }

        async function saveDatabase(data) {
            await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': MASTER_KEY
                },
                body: JSON.stringify(data)
            });
        }

        async function loadData() {
            let db = await getDatabase();
            
            // Üyeler
            document.getElementById('user-count').innerText = (db.users || []).length;
            let uList = document.getElementById('users-list');
            uList.innerHTML = db.users && db.users.length ? "" : "<p class='text-slate-500 text-sm'>Kayıtlı üye yok.</p>";
            (db.users || []).forEach(u => {
                uList.innerHTML += `<div class="bg-slate-900/80 p-3 rounded-xl border border-slate-800 text-sm flex justify-between items-center"><span class="font-medium">👤 ${u.username}</span></div>`;
            });

            // Siparişler
            let oList = document.getElementById('orders-list');
            oList.innerHTML = db.orders && db.orders.length ? "" : "<p class='text-slate-500 text-sm'>Bekleyen bildirim yok.</p>";
            (db.orders || []).forEach((o, index) => {
                let badgeColor = o.status === 'Onaylandı' ? 'text-emerald-400 bg-emerald-500/10 border-emerald-500/20' : 'text-amber-400 bg-amber-500/10 border-amber-500/20';
                oList.innerHTML += `
                    <div class="bg-slate-900/80 p-4 rounded-xl border border-slate-800 text-sm space-y-2">
                        <div class="flex justify-between items-center font-bold">
                            <span>Müşteri: ${o.username}</span>
                            <span class="px-2.5 py-1 rounded-full text-xs border ${badgeColor}">${o.status}</span>
                        </div>
                        <p class="text-slate-400 text-xs">Arşiv: ${o.items} (${o.total})</p>
                        ${o.status === 'Bekliyor' ? `<button onclick="approveOrder(${index})" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded-lg text-xs transition shadow-md shadow-emerald-600/20 mt-1">Ödemeyi Onayla & Kilidi Aç</button>` : ''}
                    </div>
                `;
            });

            // Admin Paneli Hesap Listesi ve Silme Butonları
            let accList = document.getElementById('admin-accounts-list');
            let accounts = db.accounts || [];
            if(accounts.length === 0) {
                accList.innerHTML = `<p class='text-slate-500 text-xs'>Henüz eklenmiş özel hesap yok.</p>`;
            } else {
                accList.innerHTML = '';
                accounts.forEach((acc, i) => {
                    accList.innerHTML += `
                        <div class="bg-slate-900 p-2.5 rounded-xl border border-slate-800 flex justify-between items-center text-xs">
                            <div>
                                <span class="font-bold text-red-400">${acc.name}</span>
                                <div class="text-slate-400 font-mono text-[10px] truncate max-w-[200px]">${acc.detail}</div>
                            </div>
                            <button onclick="deleteAccount(${i})" class="bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white px-2.5 py-1.5 rounded-lg transition font-semibold">Sil</button>
                        </div>
                    `;
                });
            }
        }

        async function addNewProduct() {
            let title = document.getElementById('new-title').value.trim();
            let category = document.getElementById('new-category').value;
            let price = document.getElementById('new-price').value.trim();
            let imageFile = document.getElementById('new-image').files[0];

            if(!title || !price) { alert("Lütfen video başlığını ve fiyatını doldurun!"); return; }

            let imageUrl = imageFile ? URL.createObjectURL(imageFile) : 'https://images.unsplash.com/photo-1574717024653-61fd2cf4d44d?w=500';

            let db = await getDatabase();
            if(!db.products) db.products = [];

            db.products.push({ id: 'prod_' + Date.now(), title, category, price, image: imageUrl });
            await saveDatabase(db);
            alert("Video arşivi başarıyla eklendi!");
            location.reload();
        }

        async function addPaymentAccount() {
            let name = document.getElementById('acc-name').value.trim();
            let type = document.getElementById('acc-type').value;
            let detail = document.getElementById('acc-detail').value.trim();

            if(!name || !detail) { alert("Lütfen tüm alanları doldurun!"); return; }

            let db = await getDatabase();
            if(!db.accounts) db.accounts = [];

            db.accounts.push({ id: 'acc_' + Date.now(), name, type, detail });
            await saveDatabase(db);
            alert("Ödeme hesabı başarıyla eklendi!");
            loadData();
            document.getElementById('acc-name').value = '';
            document.getElementById('acc-detail').value = '';
        }

        async function deleteAccount(index) {
            if(!confirm("Bu ödeme hesabını silmek istediğinize emin misiniz?")) return;
            let db = await getDatabase();
            if(db.accounts) {
                db.accounts.splice(index, 1);
                await saveDatabase(db);
                alert("Ödeme hesabı silindi!");
                loadData();
            }
        }

        async function approveOrder(index) {
            let db = await getDatabase();
            db.orders[index].status = 'Onaylandı';
            await saveDatabase(db);
            alert("Ödeme onaylandı!");
            loadData();
        }
    </script>
</body>
</html>
