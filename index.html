<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heisenberg // Arşiv Paneli</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #07090e; color: #94a3b8; }
        .glass { background: rgba(13, 17, 23, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .card-hover { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .card-hover:hover { transform: translateY(-4px); border-color: rgba(220, 38, 38, 0.4); box-shadow: 0 10px 30px -10px rgba(220, 38, 38, 0.15); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade { animation: fadeIn 0.4s ease-out forwards; }
    </style>
</head>
<body class="bg-[#07090e] text-slate-300 min-h-screen selection:bg-red-600 selection:text-white">

    <!-- Navbar -->
    <header class="border-b border-slate-900/80 sticky top-0 bg-[#07090e]/85 backdrop-blur-md z-40 transition-all">
        <div class="max-w-6xl mx-auto px-4 h-20 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <span class="text-white font-extrabold text-xl tracking-tight cursor-pointer" onclick="changeCategory('Tümü')">Heisenberg</span>
            </div>
            <div class="flex items-center gap-4">
                <div id="user-display" class="text-xs text-slate-400"></div>
                <button onclick="toggleCart()" class="relative bg-slate-900 border border-slate-800 hover:border-slate-700 px-4 py-2.5 rounded-xl text-xs font-semibold transition flex items-center gap-2 text-slate-200 group">
                    <i data-lucide="shopping-bag" class="w-4 h-4 text-slate-400 group-hover:text-red-500 transition"></i>
                    <span>Sepet</span>
                    <span id="cart-count" class="bg-red-600 text-white text-[10px] px-2 py-0.5 rounded-full font-bold">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-4 py-12 animate-fade">
        <div class="text-center max-w-2xl mx-auto mb-10 space-y-3">
            <h1 id="page-title" class="text-3xl md:text-4xl font-extrabold tracking-tight text-white">Güvenli Arşiv Paneli</h1>
            <p id="page-desc" class="text-slate-500 text-xs">Şifrelenmiş özel video setleri ve veri paketleri.</p>
        </div>

        <div class="flex flex-wrap justify-center gap-2 mb-10" id="category-filters">
            <button onclick="changeCategory('Tümü')" class="cat-btn bg-red-600 text-white px-4 py-2 rounded-xl text-xs font-semibold transition shadow-lg shadow-red-600/20">Tümü</button>
            <button onclick="changeCategory('Ücretsiz')" class="cat-btn bg-slate-900 border border-slate-800 text-slate-400 hover:text-white px-4 py-2 rounded-xl text-xs font-medium transition">Ücretsiz</button>
            <button onclick="changeCategory('Özel Eğlence')" class="cat-btn bg-slate-900 border border-slate-800 text-slate-400 hover:text-white px-4 py-2 rounded-xl text-xs font-medium transition">Özel Eğlence</button>
            <button onclick="changeCategory('Gece Serisi')" class="cat-btn bg-slate-900 border border-slate-800 text-slate-400 hover:text-white px-4 py-2 rounded-xl text-xs font-medium transition">Gece Serisi</button>
            <button onclick="changeCategory('Mega Paket')" class="cat-btn bg-slate-900 border border-slate-800 text-slate-400 hover:text-white px-4 py-2 rounded-xl text-xs font-medium transition">Mega Paket</button>
            <button onclick="changeCategory('Sinema & Dizi')" class="cat-btn bg-slate-900 border border-slate-800 text-slate-400 hover:text-white px-4 py-2 rounded-xl text-xs font-medium transition">Sinema & Dizi</button>
        </div>

        <div id="products-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8"></div>
        <div id="pagination-container" class="flex justify-center items-center gap-2 mb-16"></div>

        <div id="downloads-section" class="glass rounded-3xl p-6 hidden border border-slate-800/80 mb-12 animate-fade">
            <h3 class="text-xs font-bold mb-4 flex items-center gap-2 text-emerald-400"><i data-lucide="check-circle-2" class="w-4 h-4"></i> Onaylanan ve Kalıcı Olarak Erişilebilir Arşivleriniz</h3>
            <div id="user-downloads" class="space-y-3"></div>
        </div>
    </main>

    <!-- Auth Modal (Artık varsayılan olarak gizli "hidden" class'ı var) -->
    <div id="auth-modal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="glass w-full max-w-md rounded-3xl p-8 border border-slate-800 relative shadow-2xl">
            <button onclick="hideAuthModal()" class="absolute top-6 right-6 text-slate-400 hover:text-white"><i data-lucide="x" class="w-4 h-4"></i></button>
            <div class="text-center mb-6">
                <h3 id="auth-title" class="text-xl font-bold text-white">Giriş Yap</h3>
            </div>
            <div class="space-y-4">
                <input type="text" id="auth-username" placeholder="Kullanıcı Adı" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-xs focus:outline-none focus:border-red-600 text-white transition">
                <input type="password" id="auth-pass" placeholder="Şifre" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-xs focus:outline-none focus:border-red-600 text-white transition">
                <button onclick="handleAuth()" id="auth-btn" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3.5 rounded-xl transition text-xs shadow-lg shadow-red-600/20">Giriş Yap</button>
                <button onclick="switchAuthMode()" id="auth-switch" class="w-full text-slate-500 text-xs hover:text-slate-300 transition text-center underline pt-2">Hesabın yok mu? Kayıt ol</button>
            </div>
        </div>
    </div>

    <!-- Sepet Modal -->
    <div id="cart-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md hidden z-50 flex items-center justify-center p-4">
        <div class="glass w-full max-w-lg rounded-3xl p-8 border border-slate-800 relative max-h-[90vh] overflow-y-auto shadow-2xl">
            <button onclick="toggleCart()" class="absolute top-6 right-6 text-slate-400 hover:text-white"><i data-lucide="x" class="w-4 h-4"></i></button>
            <h3 class="text-xl font-bold mb-6 text-white">Sepetiniz & Ödeme</h3>
            <div id="cart-items" class="space-y-2 mb-6 max-h-40 overflow-y-auto"></div>
            <div class="border-t border-slate-800/80 pt-4 mb-6 flex justify-between font-bold text-sm text-white">
                <span>Toplam Tutar:</span><span id="cart-total" class="text-emerald-400">0 ₺</span>
            </div>
            <div class="space-y-3 mb-6">
                <p class="text-xs font-bold text-slate-400 flex items-center gap-1.5"><i data-lucide="wallet" class="w-4 h-4"></i> Ödeme Yapılabilecek Aktif Hesaplar:</p>
                <div id="payment-accounts-list" class="space-y-2"></div>
            </div>

            <!-- DEKONT YÜKLEME VE ÖNİZLEME ALANI -->
            <div class="bg-slate-900/90 p-4 rounded-2xl border border-slate-800 mb-6 text-xs">
                <label class="block text-slate-400 mb-3 font-medium">Ödeme Dekontu Görseli (Zorunlu):</label>
                
                <div id="receipt-preview-container" class="hidden mb-4 text-center">
                    <img id="receipt-preview" class="h-32 mx-auto rounded-lg border border-slate-700 object-cover shadow-md">
                    <p class="text-[10px] text-emerald-400 mt-2 font-bold">✔ Fotoğraf Seçildi</p>
                </div>

                <input type="file" id="receipt-file" accept="image/*" onchange="previewReceipt(event)" class="w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-red-600 file:text-white cursor-pointer transition">
            </div>

            <button id="checkout-btn" onclick="checkout()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl transition text-xs shadow-lg shadow-emerald-600/20">Ödemeyi Bildir & Sipariş Oluştur</button>
        </div>
    </div>

    <script>
        lucide.createIcons();
        const BIN_ID = '6a73c66cf5f4af5e29f07574';
        const MASTER_KEY = '$2a$10$zh2aEsam0mcpeFIrGF40pekMKtzirnqXSEFm27I6NOa1SGFR9bkG.';

        let isRegister = false;
        let currentUser = JSON.parse(localStorage.getItem('heisenberg_user')) || null;
        let cart = [];
        let allProducts = [];
        let currentCategory = 'Tümü';
        let currentPage = 1;
        const itemsPerPage = 12;

        window.onload = function() { checkSession(); loadStoreData(); checkUserDownloads(); }

        function showAuthModal() { document.getElementById('auth-modal').classList.remove('hidden'); }
        function hideAuthModal() { document.getElementById('auth-modal').classList.add('hidden'); }

        function switchAuthMode() {
            isRegister = !isRegister;
            document.getElementById('auth-title').innerText = isRegister ? "Yeni Hesap Oluştur" : "Giriş Yap";
            document.getElementById('auth-btn').innerText = isRegister ? "Kayıt Ol ve Başla" : "Giriş Yap";
            document.getElementById('auth-switch').innerText = isRegister ? "Zaten hesabın var mı? Giriş yap" : "Hesabın yok mu? Kayıt ol";
        }

        async function getDatabase() {
            try {
                let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, { headers: { 'X-Master-Key': MASTER_KEY } });
                let json = await res.json();
                return json.record || { users: [], orders: [], products: [], accounts: [] };
            } catch(e) { return { users: [], orders: [], products: [], accounts: [] }; }
        }

        async function saveDatabase(data) {
            let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-Master-Key': MASTER_KEY },
                body: JSON.stringify(data)
            });
            if(!res.ok) throw new Error("Veritabanı bağlantı hatası");
        }

        async function loadStoreData() {
            let db = await getDatabase();
            allProducts = db.products || [];
            
            if(allProducts.length === 0) {
                allProducts = [
                    { id: 'p0', title: 'Ücretsiz Örnek Demo Video', category: 'Ücretsiz', price: '0', image: 'https://images.unsplash.com/photo-1535223289827-42f1e9919769?w=500', videoLink: 'https://www.google.com' }
                ];
            }
            renderProducts();
            
            let accContainer = document.getElementById('payment-accounts-list');
            if(db.accounts && db.accounts.length > 0) {
                accContainer.innerHTML = '';
                db.accounts.forEach(acc => {
                    let icon = acc.type === 'Kripto' ? '🪙' : '🏦';
                    accContainer.innerHTML += `<div class="bg-slate-950 p-3 rounded-xl border border-slate-800 text-xs space-y-1"><div class="font-bold text-slate-200">${icon} ${acc.name}</div><div class="font-mono text-slate-400 select-all">${acc.detail}</div></div>`;
                });
            } else { accContainer.innerHTML = `<div class="text-xs text-slate-500">Henüz hesap eklenmemiş.</div>`; }
        }

        function changeCategory(cat) {
            currentCategory = cat; currentPage = 1;
            document.getElementById('page-title').innerText = cat === 'Tümü' ? 'Güvenli Arşiv Paneli' : cat + ' Arşivleri';
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.className = (btn.innerText.trim() === cat.trim()) ? "cat-btn bg-red-600 text-white px-4 py-2 rounded-xl text-xs font-semibold transition shadow-lg shadow-red-600/20" : "cat-btn bg-slate-900 border border-slate-800 text-slate-400 hover:text-white px-4 py-2 rounded-xl text-xs font-medium transition";
            });
            renderProducts();
        }

        // YENİ: Giriş kontrolü yapan aksiyon fonksiyonu
        function handleProductAction(type, link, title, price, id) {
            if (!currentUser) {
                showAuthModal();
                return;
            }
            
            if (type === 'free') {
                window.open(link, '_blank');
            } else if (type === 'paid') {
                addToCart(title, price, id);
            }
        }

        function renderProducts() {
            let grid = document.getElementById('products-grid');
            if(!grid) return;
            grid.innerHTML = '';
            
            let filtered = currentCategory === 'Tümü' ? allProducts : allProducts.filter(p => p.category.trim() === currentCategory.trim());
            let totalPages = Math.ceil(filtered.length / itemsPerPage) || 1;
            if(currentPage > totalPages) currentPage = totalPages;
            
            let start = (currentPage - 1) * itemsPerPage;
            let paginatedItems = filtered.slice(start, start + itemsPerPage);
            
            if(paginatedItems.length === 0) {
                grid.innerHTML = `<div class="col-span-3 text-center py-16 text-slate-500 text-xs">Bu kategoride henüz arşiv bulunmuyor.</div>`;
                document.getElementById('pagination-container').innerHTML = '';
                return;
            }

            paginatedItems.forEach(p => {
                let isFree = p.price === '0' || p.price === 0 || p.price === '';
                let priceText = isFree ? '<span class="text-emerald-400 font-bold">Ücretsiz</span>' : `<span class="text-emerald-400 font-bold">${p.price} ₺</span>`;
                
                let realLink = p.videoLink || '#';
                
                // YENİ: Butonlar artık handleProductAction'a gidiyor, o da girişi kontrol ediyor.
                let btnAction = isFree 
                    ? `<button onclick="handleProductAction('free', '${realLink}')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-xl text-xs font-semibold transition shadow-md shadow-emerald-600/20">Hemen İzle / İndir</button>` 
                    : `<button onclick="handleProductAction('paid', null, '${p.title}', '${p.price}', '${p.id}')" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2.5 rounded-xl text-xs font-semibold transition shadow-md shadow-red-600/20">Sepete Ekle</button>`;

                grid.innerHTML += `
                    <div class="glass rounded-3xl p-5 flex flex-col justify-between card-hover animate-fade">
                        <div>
                            <div class="aspect-video bg-slate-950 rounded-2xl overflow-hidden relative mb-4 border border-slate-800/80 flex items-center justify-center">
                                <img src="${p.image}" class="w-full h-full object-cover opacity-85">
                                <span class="absolute top-3 left-3 bg-slate-950/85 backdrop-blur-md px-3 py-1 rounded-full text-[10px] font-bold ${isFree ? 'text-emerald-400 border-emerald-500/30' : 'text-slate-400 border-slate-800'} border">${p.category}</span>
                            </div>
                            <h3 class="font-bold text-sm mb-1 text-white">${p.title}</h3>
                        </div>
                        <div class="flex items-center justify-between border-t border-slate-800/80 pt-4">
                            <span class="text-base">${priceText}</span>${btnAction}
                        </div>
                    </div>`;
            });
            renderPagination(totalPages);
            lucide.createIcons();
        }

        function renderPagination(totalPages) {
            let pContainer = document.getElementById('pagination-container');
            if(!pContainer) return;
            pContainer.innerHTML = '';
            if(totalPages <= 1) return;
            for(let i = 1; i <= totalPages; i++) {
                let activeClass = i === currentPage ? 'bg-red-600 text-white font-bold shadow-lg' : 'bg-slate-900 border border-slate-800 text-slate-400';
                pContainer.innerHTML += `<button onclick="goToPage(${i})" class="px-3.5 py-2 rounded-xl text-xs transition ${activeClass}">${i}</button>`;
            }
        }

        function goToPage(page) { currentPage = page; renderProducts(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

        async function handleAuth() {
            const username = document.getElementById('auth-username').value.trim();
            const pass = document.getElementById('auth-pass').value.trim();
            if(!username || !pass) { alert("Lütfen tüm alanları doldurun!"); return; }
            let db = await getDatabase();
            if(isRegister) {
                if(db.users.some(u => u.username === username)) { alert("Kullanıcı adı alınmış!"); return; }
                db.users.push({ username, password: pass });
                await saveDatabase(db);
                alert("Kayıt başarılı! Lütfen şimdi giriş yapın."); switchAuthMode();
            } else {
                let user = db.users.find(u => u.username === username && u.password === pass);
                if(user) {
                    currentUser = user; localStorage.setItem('heisenberg_user', JSON.stringify(currentUser));
                    checkSession(); location.reload();
                } else { alert("Hatalı giriş!"); }
            }
        }

        // YENİ: Check session güncellendi, başlangıçta modalı ekrana yapıştırmıyor.
        function checkSession() {
            if(currentUser) {
                document.getElementById('auth-modal').classList.add('hidden');
                document.getElementById('user-display').innerHTML = `<span class="text-slate-500">Üye:</span> <strong class="text-slate-200">${currentUser.username}</strong> | <button onclick="logout()" class="text-red-500 hover:underline ml-1 font-bold">Çıkış</button>`;
            } else {
                document.getElementById('auth-modal').classList.add('hidden');
                document.getElementById('user-display').innerHTML = `<button onclick="showAuthModal()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-xl text-xs font-bold transition shadow-lg shadow-red-600/20">Giriş Yap</button>`;
            }
        }

        function logout() { localStorage.removeItem('heisenberg_user'); location.reload(); }

        function toggleCart() {
            document.getElementById('cart-modal').classList.toggle('hidden');
            let total = cart.reduce((sum, i) => sum + parseInt(i.price), 0);
            document.getElementById('cart-total').innerText = total + " ₺";
            let container = document.getElementById('cart-items');
            container.innerHTML = cart.length ? "" : "<p class='text-slate-600 text-xs py-4 text-center'>Sepetiniz boş.</p>";
            cart.forEach(item => container.innerHTML += `<div class="flex justify-between items-center text-xs bg-slate-900 p-3 rounded-xl border border-slate-800 text-white"><span>${item.name}</span><span class="text-emerald-400 font-bold">${item.price} ₺</span></div>`);
        }

        function addToCart(name, price, id) { cart.push({ name, price, id }); document.getElementById('cart-count').innerText = cart.length; alert("Sepete eklendi."); }

        function previewReceipt(event) {
            const file = event.target.files[0];
            const container = document.getElementById('receipt-preview-container');
            const previewImage = document.getElementById('receipt-preview');

            if(file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    previewImage.src = e.target.result;
                    container.classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            } else {
                container.classList.add('hidden');
            }
        }

        function compressReceiptExtreme(file, callback) {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function (event) {
                const img = new Image();
                img.src = event.target.result;
                img.onload = function () {
                    const canvas = document.createElement('canvas');
                    
                    const MAX_WIDTH = 400; 
                    const MAX_HEIGHT = 600;
                    let width = img.width; 
                    let height = img.height;
                    
                    if (width > height) { 
                        if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; } 
                    } else { 
                        if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; } 
                    }
                    
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    let ultraSmallBase64 = canvas.toDataURL('image/jpeg', 0.4);
                    callback(ultraSmallBase64);
                }
            }
        }

        async function checkout() {
            if (!currentUser) { showAuthModal(); return; }

            const fileInput = document.getElementById('receipt-file');
            const btn = document.getElementById('checkout-btn');

            if (cart.length === 0) { alert("Lütfen sepetinize arşiv ekleyin!"); return; }
            if (fileInput.files.length === 0) { alert("Lütfen ödeme dekontu görselini yükleyin!"); return; }

            btn.innerText = "Siparişiniz Sisteme Kaydediliyor...";
            btn.disabled = true;
            btn.classList.add('opacity-50', 'cursor-not-allowed');

            try {
                let file = fileInput.files[0];
                
                compressReceiptExtreme(file, async function(microBase64) {
                    try {
                        let db = await getDatabase();
                        if(!db.orders) db.orders = [];
                        
                        db.orders.push({
                            id: 'ord_' + Date.now(), 
                            username: currentUser.username,
                            items: cart.map(i => i.name).join(", "),
                            total: cart.reduce((sum, i) => sum + parseInt(i.price), 0) + " ₺",
                            status: 'Bekliyor', 
                            receipt: microBase64 
                        });

                        await saveDatabase(db);
                        
                        alert("Dekontunuz başarıyla iletildi! Admin onayından sonra arşiviniz açılacaktır.");
                        location.reload();
                    } catch(err) {
                        alert("Hata oluştu. İnternet bağlantınızı kontrol edip tekrar deneyin.");
                        btn.innerText = "Ödemeyi Bildir & Sipariş Oluştur";
                        btn.disabled = false;
                        btn.classList.remove('opacity-50', 'cursor-not-allowed');
                    }
                });

            } catch(e) {
                alert("Beklenmeyen bir hata oluştu.");
                btn.innerText = "Ödemeyi Bildir & Sipariş Oluştur";
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }

        async function checkUserDownloads() {
            if(!currentUser) return;
            let db = await getDatabase();
            let myOrders = (db.orders || []).filter(o => o.username === currentUser.username && o.status === 'Onaylandı');
            
            if(myOrders.length > 0) {
                document.getElementById('downloads-section').classList.remove('hidden');
                let container = document.getElementById('user-downloads');
                container.innerHTML = '';
                
                myOrders.forEach(order => {
                    let orderedItemNames = order.items.split(", ");
                    orderedItemNames.forEach(itemName => {
                        let productMatch = (db.products || []).find(p => p.title.trim() === itemName.trim());
                        let realVideoLink = (productMatch && productMatch.videoLink) ? productMatch.videoLink : '#';

                        container.innerHTML += `
                            <div class="flex items-center justify-between bg-slate-900 hover:bg-slate-800 border border-slate-800 p-3.5 rounded-2xl transition text-xs font-bold text-white group">
                                <span>📥 ${itemName}</span>
                                <button onclick="window.open('${realVideoLink}', '_blank')" class="text-emerald-400 hover:underline cursor-pointer bg-emerald-500/10 px-3 py-1.5 rounded-xl border border-emerald-500/20">Videoyu İzle / İndir</button>
                            </div>
                        `;
                    });
                });
            }
        }
    </script>
</body>
</html>
