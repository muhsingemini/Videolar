<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEISENBERG // SECURE ARCHIVE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Share Tech Mono', monospace; background-color: #020408; color: #00ff66; }
        .matrix-glow { box-shadow: 0 0 20px rgba(0, 255, 102, 0.2); }
        .matrix-border { border: 1px solid rgba(0, 255, 102, 0.2); }
        .glass-terminal { background: rgba(2, 6, 15, 0.9); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-[#020408] text-[#00ff66] min-h-screen selection:bg-red-600 selection:text-white">

    <!-- Navbar / Header (Logo Yok, Sadece Terminal Başlığı) -->
    <header class="border-b border-[#00ff66]/20 sticky top-0 glass-terminal z-40">
        <div class="max-w-6xl mx-auto px-4 h-20 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <span class="text-red-500 font-bold tracking-widest text-lg">[SYS_ROOT@HEISENBERG:~]#</span>
            </div>
            
            <div class="flex items-center gap-4">
                <div id="user-display" class="text-sm font-bold text-slate-300"></div>
                <button onclick="toggleCart()" class="relative bg-black border border-[#00ff66]/40 hover:border-[#00ff66] px-4 py-2 rounded-xl text-sm font-bold transition flex items-center gap-2 text-[#00ff66]">
                    <i data-lucide="terminal" class="w-4 h-4 text-red-500"></i>
                    <span>SEPET</span>
                    <span id="cart-count" class="bg-red-600 text-white text-xs px-2 py-0.5 rounded-full font-bold">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-4 py-12">
        <div class="text-center max-w-2xl mx-auto mb-12 space-y-4">
            <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-red-600/10 border border-red-600/30 text-red-500 text-xs font-bold animate-pulse">
                <span class="w-2 h-2 rounded-full bg-red-600"></span> SECURE CONNECTION ESTABLISHED
            </div>
            <h1 class="text-3xl md:text-5xl font-extrabold tracking-tight text-white uppercase glitch-text">YERALTI ARŞİV SİSTEMİ</h1>
            <p class="text-slate-400 text-sm">5 Farkli sinifta şifrelenmiş özel video setleri ve veri paketleri.</p>
        </div>

        <!-- 5 Kategori Filtresi -->
        <div class="flex flex-wrap justify-center gap-3 mb-12" id="category-filters">
            <button onclick="filterCategory('Tümü')" class="cat-btn bg-red-600 text-white px-4 py-2 rounded-lg text-xs font-bold transition shadow-lg shadow-red-600/30">TÜMÜ</button>
            <button onclick="filterCategory('Özel Eğlence')" class="cat-btn bg-black border border-[#00ff66]/30 text-[#00ff66] hover:border-[#00ff66] px-4 py-2 rounded-lg text-xs font-semibold transition">ÖZEL EĞLENCE</button>
            <button onclick="filterCategory('Gece Serisi')" class="cat-btn bg-black border border-[#00ff66]/30 text-[#00ff66] hover:border-[#00ff66] px-4 py-2 rounded-lg text-xs font-semibold transition">GECE SERİSİ</button>
            <button onclick="filterCategory('Mega Paket')" class="cat-btn bg-black border border-[#00ff66]/30 text-[#00ff66] hover:border-[#00ff66] px-4 py-2 rounded-lg text-xs font-semibold transition">MEGA PAKET</button>
            <button onclick="filterCategory('Sinema & Dizi')" class="cat-btn bg-black border border-[#00ff66]/30 text-[#00ff66] hover:border-[#00ff66] px-4 py-2 rounded-lg text-xs font-semibold transition">SİNEMA & DİZİ</button>
            <button onclick="filterCategory('Belgesel & Eğitim')" class="cat-btn bg-black border border-[#00ff66]/30 text-[#00ff66] hover:border-[#00ff66] px-4 py-2 rounded-lg text-xs font-semibold transition">BELGESEL & EĞİTİM</button>
        </div>

        <!-- Ürünler -->
        <div id="products-grid" class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-16"></div>

        <!-- İndirme Paneli -->
        <div id="downloads-section" class="glass-terminal rounded-2xl p-8 hidden border border-[#00ff66]/30 matrix-glow">
            <h3 class="text-lg font-bold mb-4 flex items-center gap-2 text-[#00ff66]">
                <i data-lucide="shield-check" class="w-5 h-5 text-red-500"></i> ŞİFRESİ ÇÖZÜLEN ARŞİVLER
            </h3>
            <div id="user-downloads" class="space-y-3"></div>
        </div>
    </main>

    <!-- Auth Modal -->
    <div id="auth-modal" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="glass-terminal w-full max-w-md rounded-2xl p-8 matrix-border shadow-2xl relative">
            <div class="text-center mb-6">
                <span class="text-red-500 font-bold text-xs">[EKSİK GÜVENLİK DOĞRULAMASI]</span>
                <h3 id="auth-title" class="text-2xl font-extrabold mt-2 text-white">SİSTEME GİRİŞ</h3>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-[#00ff66] mb-1">KULLANICI KODU:</label>
                    <input type="text" id="auth-username" class="w-full bg-black border border-[#00ff66]/40 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-red-500 text-white">
                </div>
                <div>
                    <label class="block text-xs font-bold text-[#00ff66] mb-1">ERİŞİM ŞİFRESİ:</label>
                    <input type="password" id="auth-pass" class="w-full bg-black border border-[#00ff66]/40 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-red-500 text-white">
                </div>
                <button onclick="handleAuth()" id="auth-btn" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-red-600/30">ERİŞİM İSTE</button>
                <button onclick="switchAuthMode()" id="auth-switch" class="w-full text-slate-400 text-xs hover:text-white transition text-center underline pt-2">Kayıtlı değil misin? Yeni kayıt oluştur</button>
            </div>
        </div>
    </div>

    <!-- Sepet & Ödeme Modal -->
    <div id="cart-modal" class="fixed inset-0 bg-black/90 backdrop-blur-md hidden z-50 flex items-center justify-center p-4">
        <div class="glass-terminal w-full max-w-lg rounded-2xl p-8 matrix-border relative max-h-[90vh] overflow-y-auto">
            <button onclick="toggleCart()" class="absolute top-6 right-6 text-red-500 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            <h3 class="text-xl font-extrabold mb-6 text-white">AKTİF SEPET & ÖDEME</h3>
            
            <div id="cart-items" class="space-y-3 mb-6 max-h-40 overflow-y-auto"></div>
            
            <div class="border-t border-[#00ff66]/20 pt-4 mb-6 flex justify-between font-bold text-lg text-white">
                <span>TOPLAM:</span>
                <span id="cart-total" class="text-red-500">0 ₺</span>
            </div>

            <div class="space-y-4 mb-6">
                <p class="text-xs font-bold text-amber-400 flex items-center gap-1.5"><i data-lucide="terminal" class="w-4 h-4"></i> GÜVENLİ AKTARIM HESAPLARI:</p>
                <div id="payment-accounts-list" class="space-y-2"></div>
            </div>

            <div class="bg-black p-4 rounded-xl border border-[#00ff66]/20 mb-6 text-xs">
                <label class="block text-slate-400 mb-1 font-bold">ÖDEME DEKONTU VEYA HASH KODU:</label>
                <input type="file" id="receipt-file" class="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-red-600 file:text-white cursor-pointer">
            </div>

            <button onclick="checkout()" class="w-full bg-[#00ff66] hover:bg-[#00cc52] text-black font-extrabold py-3.5 rounded-xl transition shadow-lg shadow-[#00ff66]/20">BİLDİRİMİ GÖNDER</button>
        </div>
    </div>

    <script>
        lucide.createIcons();

        const BIN_ID = '6a73c66cf5f4af5e29f07574';
        const MASTER_KEY = '$2a$10$zh2aEsam0mcpeFIrGF40pekMKtzirnqXSEFm27I6NOa1SGFR9bkG.';

        let isRegister = false;
        let currentUser = JSON.parse(localStorage.getItem('heisenberg_user')) || null;
        let cart = [];
        let allProducts = [];
        let currentFilter = 'Tümü';

        window.onload = function() {
            checkSession();
            loadStoreData();
            checkUserDownloads();
        }

        function switchAuthMode() {
            isRegister = !isRegister;
            document.getElementById('auth-title').innerText = isRegister ? "YENİ AJAN KAYDI" : "SİSTEME GİRİŞ";
            document.getElementById('auth-btn').innerText = isRegister ? "KAYDI TAMAMLA" : "ERİŞİM İSTE";
            document.getElementById('auth-switch').innerText = isRegister ? "Zaten kayıtlı mısın? Giriş yap" : "Kayıtlı değil misin? Yeni kayıt oluştur";
        }

        async function getDatabase() {
            try {
                let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': MASTER_KEY }
                });
                let json = await res.json();
                return json.record || { users: [], orders: [], products: [], accounts: [] };
            } catch(e) {
                return { users: [], orders: [], products: [], accounts: [] };
            }
        }

        async function saveDatabase(data) {
            await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': MASTER_KEY
                },
                body: JSON.stringify(data)
            });
        }

        async function loadStoreData() {
            let db = await getDatabase();
            allProducts = db.products || [];
            
            if(allProducts.length === 0) {
                allProducts = [
                    { id: 'p1', title: 'Özel Eğlence Vol. 1', category: 'Özel Eğlence', price: '150', image: 'https://images.unsplash.com/photo-1574717024653-61fd2cf4d44d?w=500' },
                    { id: 'p2', title: 'Gece Serisi Özel Set', category: 'Gece Serisi', price: '250', image: 'https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=500' },
                    { id: 'p3', title: 'Mega Paket Arşivi', category: 'Mega Paket', price: '400', image: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=500' }
                ];
            }
            renderProducts();
            renderPaymentAccounts(db.accounts || []);
        }

        function renderPaymentAccounts(accounts) {
            let container = document.getElementById('payment-accounts-list');
            if(!accounts || accounts.length === 0) {
                container.innerHTML = `
                    <div class="bg-black p-3 rounded-xl border border-[#00ff66]/20 text-xs text-[#00ff66] font-mono">
                        TR00 0000 0000 0000 0000 0000 00 (Varsayılan IBAN - Muhsin B.)
                    </div>
                `;
                return;
            }
            container.innerHTML = '';
            accounts.forEach(acc => {
                let icon = acc.type === 'Kripto' ? '🪙' : '🏦';
                container.innerHTML += `
                    <div class="bg-black p-3 rounded-xl border border-[#00ff66]/20 text-xs space-y-1">
                        <div class="font-bold text-red-500">${icon} ${acc.name} (${acc.type})</div>
                        <div class="font-mono text-slate-300 select-all">${acc.detail}</div>
                    </div>
                `;
            });
        }

        function filterCategory(cat) {
            currentFilter = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if(btn.innerText.includes(cat.toUpperCase()) || (cat === 'Tümü' && btn.innerText === 'TÜMÜ')) {
                    btn.className = "cat-btn bg-red-600 text-white px-4 py-2 rounded-lg text-xs font-bold transition shadow-lg shadow-red-600/30";
                } else {
                    btn.className = "cat-btn bg-black border border-[#00ff66]/30 text-[#00ff66] hover:border-[#00ff66] px-4 py-2 rounded-lg text-xs font-semibold transition";
                }
            });
            renderProducts();
        }

        function renderProducts() {
            let grid = document.getElementById('products-grid');
            grid.innerHTML = '';
            
            let filtered = currentFilter === 'Tümü' ? allProducts : allProducts.filter(p => p.category === currentFilter);
            
            if(filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-3 text-center py-12 text-slate-500">Bu sınıfta kayıtlı veri bulunamadı.</div>`;
                return;
            }

            filtered.forEach(p => {
                grid.innerHTML += `
                    <div class="glass-terminal rounded-2xl p-6 flex flex-col justify-between matrix-border hover:border-red-600 transition duration-300 group">
                        <div>
                            <div class="aspect-video bg-black rounded-xl overflow-hidden relative mb-5 border border-[#00ff66]/20 flex items-center justify-center">
                                <img src="${p.image}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500 opacity-80">
                                <span class="absolute top-3 left-3 bg-black/90 px-3 py-1 rounded-full text-[10px] font-bold text-red-500 border border-red-500/30">${p.category}</span>
                            </div>
                            <h3 class="font-bold text-lg mb-1 text-white">${p.title}</h3>
                            <p class="text-slate-400 text-xs mb-6">Şifrelenmiş yüksek çözünürlüklü arşiv verisi.</p>
                        </div>
                        <div class="flex items-center justify-between border-t border-[#00ff66]/20 pt-4">
                            <span class="text-xl font-black text-[#00ff66]">${p.price} ₺</span>
                            <button onclick="addToCart('${p.title}', '${p.price}', '${p.id}')" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2.5 rounded-xl text-xs font-bold transition shadow-md shadow-red-600/20">SEPETE EKLE</button>
                        </div>
                    </div>
                `;
            });
            lucide.createIcons();
        }

        async function handleAuth() {
            const username = document.getElementById('auth-username').value.trim();
            const pass = document.getElementById('auth-pass').value.trim();
            if(!username || !pass) { alert("Lütfen tüm alanları doldurun!"); return; }

            let db = await getDatabase();

            if(isRegister) {
                if(db.users.some(u => u.username === username)) {
                    alert("Bu kullanıcı kodu zaten sistemde kayıtlı!");
                    return;
                }
                db.users.push({ username, password: pass });
                await saveDatabase(db);
                alert("Kayıt oluşturuldu! Şimdi giriş yapabilirsiniz.");
                switchAuthMode();
            } else {
                let user = db.users.find(u => u.username === username && u.password === pass);
                if(user) {
                    currentUser = user;
                    localStorage.setItem('heisenberg_user', JSON.stringify(currentUser));
                    checkSession();
                    location.reload();
                } else {
                    alert("Yetkisiz erişim! Kullanıcı kodu veya şifre hatalı.");
                }
            }
        }

        function checkSession() {
            const modal = document.getElementById('auth-modal');
            const display = document.getElementById('user-display');
            if(currentUser) {
                modal.classList.add('hidden');
                display.innerHTML = `<span class="text-red-500">[AGENT]:</span> <strong class="text-white">${currentUser.username}</strong> | <button onclick="logout()" class="text-red-500 hover:underline ml-1 font-bold">ÇIKIŞ</button>`;
            } else {
                modal.classList.remove('hidden');
            }
        }

        function logout() {
            localStorage.removeItem('heisenberg_user');
            location.reload();
        }

        function toggleCart() {
            document.getElementById('cart-modal').classList.toggle('hidden');
            let total = cart.reduce((sum, i) => sum + parseInt(i.price), 0);
            document.getElementById('cart-total').innerText = total + " ₺";
            let container = document.getElementById('cart-items');
            container.innerHTML = cart.length ? "" : "<p class='text-slate-500 text-xs'>Sepetiniz boş.</p>";
            cart.forEach(item => {
                container.innerHTML += `<div class="flex justify-between items-center text-xs bg-black p-3 rounded-xl border border-[#00ff66]/20 text-white"><span>${item.name}</span><span class="text-[#00ff66] font-bold">${item.price} ₺</span></div>`;
            });
        }

        function addToCart(name, price, id) {
            cart.push({ name, price, id });
            document.getElementById('cart-count').innerText = cart.length;
            alert("Veri sepete eklendi.");
        }

        async function checkout() {
            const file = document.getElementById('receipt-file').files[0];
            if(cart.length === 0 || !file) { alert("Sepet boş veya kanıt dosyası eklenmedi!"); return; }

            let itemsText = cart.map(i => i.name).join(", ");
            let totalVal = cart.reduce((sum, i) => sum + parseInt(i.price), 0) + " ₺";

            let db = await getDatabase();
            if(!db.orders) db.orders = [];
            db.orders.push({
                id: 'ord_' + Date.now(),
                username: currentUser.username,
                items: itemsText,
                total: totalVal,
                status: 'Bekliyor'
            });
            await saveDatabase(db);

            alert("Ödeme bildirimi sisteme iletildi. Admin onayından sonra arşiv açılacaktır.");
            location.reload();
        }

        async function checkUserDownloads() {
            if(!currentUser) return;
            let db = await getDatabase();
            let myOrders = (db.orders || []).filter(o => o.username === currentUser.username && o.status === 'Onaylandı');
            
            if(myOrders.length > 0) {
                document.getElementById('downloads-section').classList.remove('hidden');
                let container = document.getElementById('user-downloads');
                container.innerHTML = '';
                myOrders.forEach(order => {
                    container.innerHTML += `<a href="#" class="flex items-center justify-between bg-black hover:bg-slate-900 border border-[#00ff66]/30 p-4 rounded-xl transition text-xs font-bold text-white group"><span>📥 ${order.items}</span><span class="text-red-500 group-hover:underline">Şifreyi Çöz & İndir</span></a>`;
                });
            }
        }
    </script>
</body>
</html>
